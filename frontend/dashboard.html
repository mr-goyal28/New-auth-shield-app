<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AuthShield</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
    <div style="width: 36px; height: 36px; border: 3px solid var(--primary); border-top-color: transparent; border-radius: 50%;" class="spinner"></div>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Verifying session authentication...</p>
  </div>

  <!-- Main Dashboard Content -->
  <div id="dashboardContent" style="display: none;">
    <!-- Navbar Header -->
    <nav class="navbar">
      <a href="dashboard.html" class="brand-link">
        <div class="brand-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <span class="brand-title">Auth<span class="gradient-text">Shield</span></span>
      </a>

      <div class="nav-actions">
        <div style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(255, 255, 255, 0.06); border-radius: 20px; border: 1px solid var(--border-color);">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="navUserName" style="font-size: 0.875rem; font-weight: 600;">Loading...</span>
        </div>
        <button id="logoutBtn" class="btn-secondary" style="padding: 8px 14px; font-size: 0.85rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          Logout
        </button>
      </div>
    </nav>

    <main class="dashboard-container">
      <!-- Welcome Header Banner -->
      <div class="glass-card welcome-card">
        <div>
          <div class="badge-active">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Authenticated Session Active
          </div>
          <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 6px;">
            Welcome, <span id="userName" class="gradient-text">User</span>
          </h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">
            You are securely logged into your AuthShield account dashboard.
          </p>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="grid-cards">
        <!-- Email -->
        <div class="glass-card stat-card">
          <div class="stat-header">
            <div class="stat-icon" style="background: rgba(168, 85, 247, 0.15); color: var(--secondary);">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </div>
            <div style="overflow: hidden;">
              <div class="stat-title">Email Address</div>
              <div id="userEmail" class="stat-value">-</div>
            </div>
          </div>
        </div>

        <!-- Phone -->
        <div class="glass-card stat-card">
          <div class="stat-header">
            <div class="stat-icon" style="background: rgba(6, 182, 212, 0.15); color: var(--accent);">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div>
              <div class="stat-title">Phone Number</div>
              <div id="userPhone" class="stat-value">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Account Details & Metadata -->
      <div class="glass-card" style="padding: 28px;">
        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          Account Metadata
        </h3>

        <div class="meta-row">
          <span style="color: var(--text-muted);">User ID</span>
          <span id="userId" style="font-weight: 700;">#</span>
        </div>

        <div class="meta-row">
          <span style="color: var(--text-muted);">Account Created</span>
          <span id="userCreatedAt" style="font-weight: 600;">-</span>
        </div>

        <div class="meta-row">
          <span style="color: var(--text-muted);">Session Type</span>
          <span style="font-weight: 600; color: #6ee7b7;">JWT in HttpOnly Cookie</span>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthShield - Authentication System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
    <div style="width: 32px; height: 32px; border: 3px solid var(--primary); border-top-color: transparent; border-radius: 50%;" class="spinner"></div>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Checking session authentication...</p>
  </div>

  <script src="js/config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await apiFetch('/me');
        window.location.href = 'dashboard.html';
      } catch {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
